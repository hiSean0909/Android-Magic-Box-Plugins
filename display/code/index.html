<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Display</title><style>
body{font-family:sans-serif;margin:0;background:#f8f6f0;color:#313744}#settings{padding:20px;max-width:500px;margin:auto}label{display:block;margin:16px 0}input,select,button{font:inherit}input[type=text],input[type=number],select{display:block;width:100%;box-sizing:border-box;padding:8px}button{padding:10px 20px}#screen{display:none;position:fixed;inset:0;overflow:hidden}#message{position:absolute;top:50%;white-space:nowrap;transform:translateY(-50%);will-change:left}
</style></head><body><div id="settings"><h1>Display</h1><label>Text<input id="text" type="text" value="Hello!"></label><label>Text size<input id="size" type="number" min="12" max="200" value="64"></label><label>Text color<select id="foreground"></select></label><label>Background color<select id="background"></select></label><label><input id="italic" type="checkbox"> Italic</label><button id="show">Show</button><p id="error"></p></div><div id="screen"><span id="message"></span></div><script src="display.js"></script></body></html>
