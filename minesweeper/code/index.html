<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper</title><style>
body{font-family:sans-serif;text-align:center;background:#f8f6f0;color:#313744;margin:20px}#board{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-width:450px;margin:20px auto;touch-action:manipulation;user-select:none}.cell{aspect-ratio:1;border:0;background:#829aa1;font-size:clamp(14px,4vw,24px);font-weight:bold;padding:0}.revealed{background:#e5e1d8}.flag{color:#d00}button{padding:10px 20px}#message{min-height:2em}
</style></head><body><h1>Minesweeper</h1><p>Flags: <span id="flags">0</span> / 10</p><button id="new">New Game</button><div id="board"></div><p id="message">Tap to reveal; hold to flag</p><script src="mines.js"></script></body></html>
